<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>EmitKit</title>
    <meta
      name="description"
      content="EmitKit: product events and push notifications from anywhere in your stack."
    />
    <meta name="theme-color" content="#f4f4f2" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // The stored theme before the first paint (rules: web/app/lib/theme.ts).
      (function () {
        var dark = false;
        try {
          var stored = localStorage.getItem("emitkit:theme");
          dark =
            stored === "dark" ||
            (stored !== "light" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (error) {}
        var root = document.documentElement;
        root.className = dark ? "dark" : "light";
        root.dataset.theme = dark ? "dark" : "light";
        if (dark) {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#050606");
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EmitKit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  </head>
  <body class="bg-background text-foreground min-h-svh antialiased">
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
